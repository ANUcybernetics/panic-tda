  "persim>=0.3.8",
  "torch>=2.15,<3.0",
  "diffusers>=0.42,<0.43",
  "transformers>=5.22,<6.0",
  "sentence-transformers>=6.2,<7.0",
  "accelerate>=1.15",
  "pyvips>=2.2",
  "sentencepiece>=0.2",
  "einops>=0.8",
  "timm>=1.0",
  "scikit-learn>=1.6",
  "protobuf>=5.0",
  "qwen-vl-utils>=0.0.8",
  "peft>=0.21",
  "bitsandbytes>=0.50",
  "backoff>=2.2",
  "evoc>=0.3",
